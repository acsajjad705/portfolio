<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syed Sajjad Raza - Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Welcome to My Portfolio</h1>
    <nav>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section id="about">
    <h2>About Me</h2>
    <img src="profile.jpg" alt="Profile picture of Syed Sajjad Raza" width="200">
    <p>I am a BSIT student passionate about IT, engineering, and innovation.</p>
  </section>

  <section id="projects">
    <h2>Projects</h2>
    <div class="project-card">
      <h3>Portfolio Website</h3>
      <p>This site demonstrates HTML, CSS, and JavaScript skills.</p>
      <button onclick="showAlert()">View Details</button>
    </div>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <form>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
      
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
      
      <button type="submit">Send</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 Syed Sajjad Raza</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
